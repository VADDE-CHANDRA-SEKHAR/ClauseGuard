spring.application.name=clauseguard-backend

# H2 in-memory DB — zero external DB setup needed for the assessment/demo.
# Swap to MySQL by changing these 4 lines + the driver dependency if persistence across restarts is required.
spring.datasource.url=jdbc:h2:mem:clauseguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

groq.api.key=${GROQ_API_KEY:}
